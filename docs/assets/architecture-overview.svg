<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Trading Bot Research Architecture</title>
  <desc id="desc">High-level repository architecture showing scripts and backtests calling the trading bot package, cache, results, reports, and documentation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #1e1e1e; }
      .label { font: 600 20px Arial, sans-serif; fill: #1e1e1e; }
      .small { font: 600 16px Arial, sans-serif; fill: #1e1e1e; }
      .box { stroke-width: 3; rx: 16; ry: 16; }
      .arrow { fill: none; stroke: #1e1e1e; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text class="title" x="600" y="65" text-anchor="middle">Trading Bot Research Architecture</text>

  <rect class="box" x="80" y="130" width="210" height="90" fill="#a5d8ff" stroke="#4a9eed"/>
  <text class="label" x="185" y="166" text-anchor="middle">scripts/</text>
  <text class="label" x="185" y="194" text-anchor="middle">CLI runners</text>

  <rect class="box" x="80" y="290" width="210" height="90" fill="#fff3bf" stroke="#f59e0b"/>
  <text class="label" x="185" y="326" text-anchor="middle">tests/</text>
  <text class="label" x="185" y="354" text-anchor="middle">backtest suites</text>

  <rect class="box" x="430" y="200" width="300" height="270" fill="#e5dbff" stroke="#8b5cf6" opacity="0.65"/>
  <text class="label" x="580" y="232" text-anchor="middle">src/trading_bot</text>
  <rect class="box" x="470" y="255" width="220" height="55" fill="#d0bfff" stroke="#8b5cf6"/>
  <text class="small" x="580" y="289" text-anchor="middle">strategy registry</text>
  <rect class="box" x="470" y="330" width="220" height="55" fill="#c3fae8" stroke="#06b6d4"/>
  <text class="small" x="580" y="364" text-anchor="middle">indicators + filters</text>
  <rect class="box" x="470" y="405" width="220" height="55" fill="#ffd8a8" stroke="#f59e0b"/>
  <text class="small" x="580" y="439" text-anchor="middle">market data utility</text>

  <rect class="box" x="850" y="150" width="220" height="80" fill="#c3fae8" stroke="#06b6d4"/>
  <text class="small" x="960" y="183" text-anchor="middle">data_cache/</text>
  <text class="small" x="960" y="207" text-anchor="middle">ignored OHLCV</text>

  <rect class="box" x="850" y="305" width="220" height="80" fill="#b2f2bb" stroke="#22c55e"/>
  <text class="small" x="960" y="338" text-anchor="middle">results/</text>
  <text class="small" x="960" y="362" text-anchor="middle">versioned artifacts</text>

  <rect class="box" x="850" y="460" width="220" height="80" fill="#ffd8a8" stroke="#f59e0b"/>
  <text class="small" x="960" y="493" text-anchor="middle">report/</text>
  <text class="small" x="960" y="517" text-anchor="middle">ignored run output</text>

  <rect class="box" x="430" y="590" width="300" height="90" fill="#eebefa" stroke="#ec4899"/>
  <text class="label" x="580" y="625" text-anchor="middle">README + docs/</text>
  <text class="label" x="580" y="653" text-anchor="middle">project narrative</text>

  <path class="arrow" d="M 290 175 C 330 185, 370 218, 430 250" stroke="#4a9eed"/>
  <text class="small" x="350" y="193" text-anchor="middle">run</text>
  <path class="arrow" d="M 290 335 C 335 330, 375 315, 430 315" stroke="#f59e0b"/>
  <text class="small" x="350" y="336" text-anchor="middle">validate</text>
  <path class="arrow" d="M 690 432 C 770 360, 775 220, 850 190" stroke="#06b6d4"/>
  <text class="small" x="780" y="302" text-anchor="middle">read/write cache</text>
  <path class="arrow" d="M 730 345 C 775 345, 805 345, 850 345" stroke="#22c55e"/>
  <text class="small" x="790" y="336" text-anchor="middle">summaries</text>
  <path class="arrow" d="M 730 385 C 790 415, 800 482, 850 500" stroke="#f59e0b"/>
  <text class="small" x="794" y="456" text-anchor="middle">reports</text>
  <path class="arrow" d="M 580 470 L 580 590" stroke="#ec4899"/>
  <text class="small" x="620" y="538" text-anchor="middle">document</text>
</svg>
